name: Deploy to Cloudflare Pages

# Auto-deploys on every push to any branch:
#   - push to `main`  -> PRODUCTION deployment (main is the Pages production branch)
#   - push to any other branch -> a PREVIEW deployment at its own URL
# All deployments share the same D1 database.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx wrangler
      DB_NAME: loft-ring-book
      PROJECT: loft-ring-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Resolve the D1 database id from your account (creating the DB on first run)
      # and write it into wrangler.toml so the Functions bind to the real database.
      - name: Resolve/create D1 database and inject its id
        run: |
          set -euo pipefail
          get_id() {
            $WRANGLER d1 list --json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const m=a.find(x=>x.name===process.env.DB_NAME);process.stdout.write(m&&m.uuid?m.uuid:"")}catch(e){process.stdout.write("")}})'
          }
          ID="$(get_id)"
          if [ -z "$ID" ]; then
            echo "D1 database '$DB_NAME' not found — creating it."
            $WRANGLER d1 create "$DB_NAME" || true
            ID="$(get_id)"
          fi
          if [ -z "$ID" ]; then echo "::error::Could not resolve the D1 database id"; exit 1; fi
          echo "Using D1 database id: $ID"
          sed -i "s|^database_id = .*|database_id = \"$ID\"|" wrangler.toml

      # Idempotent (CREATE ... IF NOT EXISTS) — safe on every deploy.
      - name: Apply D1 schema
        run: $WRANGLER d1 execute "$DB_NAME" --remote --file=db/schema.sql

      # Seed ONLY when the database has no birds, so it never overwrites or resurrects your data.
      - name: Load seed data into an empty database
        run: |
          set -euo pipefail
          N=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "SELECT count(*) AS n FROM birds" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j[0].results[0].n))})')
          echo "Birds in database: $N"
          if [ "$N" = "0" ]; then
            $WRANGLER d1 execute "$DB_NAME" --remote --file=db/seed.sql
          else
            echo "Database already has data — seed skipped."
          fi

      - name: Create the Pages project if it doesn't exist
        run: $WRANGLER pages project create "$PROJECT" --production-branch main || true

      - name: Deploy to Cloudflare Pages
        run: $WRANGLER pages deploy --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}"

# One-time setup (run once, by you) — GitHub repo secrets
# (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - token with "Cloudflare Pages: Edit" + "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID - your account id (Cloudflare dashboard, right sidebar)
# The same token/account as the Sunstone Pricing app works.
